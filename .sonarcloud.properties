sonar.sources=src,mcp/servers,scripts
# tests/ is intentionally not declared as test sources: the custom
# zero-dependency runner (tests/run-all.js) uses plain named functions that
# SonarJS cannot recognize as test cases, so every *.test.js file was
# flagged by S2187 ("add some tests to this file") as a false positive.
# These tests run in CI on every push; CI remains their quality gate.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.tgz,**/legacy-command-shims/**
sonar.sourceEncoding=UTF-8
# branch-state, global-state and propagate-state are deliberate CommonJS
# mirrors of their TS counterparts: session hooks and the CLI cannot require
# the compiled MCP server build. tests/egc-memory-global-state.test.js
# asserts the global-state pair stays behaviorally identical; the
# propagate-state pair has matching scenarios across
# tests/scripts/propagate-state.test.js and
# tests/scripts/egc-memory-propagate.test.js instead. wrapper-options is the
# hooks' CommonJS mirror of the Guardian validator's wrapper tables and of
# parallel-options; tests/lib/wrapper-options.test.js asserts they agree on
# every wrapper, option table, parallel spec and option word.
sonar.cpd.exclusions=scripts/lib/wrapper-options.js,mcp/servers/egc-guardian/src/parallel-options.ts,scripts/lib/branch-state.js,mcp/servers/egc-memory/src/branch-state.ts,mcp/servers/egc-guardian/src/catalog-index.ts,scripts/lib/global-state.js,mcp/servers/egc-memory/src/global-state.ts,scripts/lib/propagate-state.js,mcp/servers/egc-memory/src/propagate.ts,mcp/servers/egc-memory/src/state-store-path.ts,mcp/servers/egc-guardian/src/state-store-path.ts

# Rule S2187 cannot detect the zero-dependency runner's plain-function test
# pattern; the tests/ tree is covered by CI, not Sonar test detection.
sonar.issue.ignore.multicriteria=t1
sonar.issue.ignore.multicriteria.t1.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.t1.resourceKey=**/tests/**/*
