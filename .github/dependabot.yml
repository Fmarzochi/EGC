version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/mcp/servers/egc-guardian"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/mcp/servers/egc-memory"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/.opencode"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The dashboard, the docker image pin and the fuzz harness carry their own
  # lockfiles; scripts/ci/dependency-audit.js audits all three and so does
  # Dependabot from here on.
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    # Security updates only. tests/requirements.txt is a pip-compile output
    # with hashes and no requirements.in in the tree, so a version bump of one
    # package cannot carry the transitive pins it needs (#2005 hit
    # ResolutionImpossible on pydantic-core, #2006 lacked httpx2).
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR per weekly sweep: actions that must move in lockstep (the
      # codeql-action init/analyze pair refuses mixed versions) otherwise
      # arrive as separate PRs that each fail their own CI.
      github-actions:
        patterns:
          - "*"
