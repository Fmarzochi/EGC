name: Fuzzing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-validator:
    name: Fuzz egc-guardian validator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'

      - name: Install fuzz dependencies
        working-directory: fuzz
        run: npm ci

      - name: Build fuzz target
        working-directory: fuzz
        run: npm run build:target

      - name: Run fuzzer (60-second time-box)
        run: |
          mkdir -p fuzz/artifacts fuzz/corpus
          timeout 65 fuzz/node_modules/.bin/jsfuzz fuzz/fuzz-validator.js fuzz/corpus \
            --exact-artifact-path fuzz/artifacts/crash \
            || FUZZ_EXIT=$?
          if [ "${FUZZ_EXIT:-0}" -ne 0 ] && [ "${FUZZ_EXIT:-0}" -ne 124 ]; then
            echo "Fuzzer found a crash or error (exit ${FUZZ_EXIT})"
            exit "${FUZZ_EXIT}"
          fi

      - name: Upload fuzzer artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
