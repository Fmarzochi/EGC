name: ClusterFuzzLite batch fuzzing

on:
  workflow_dispatch:
  # schedule disabled (EGC#910): ClusterFuzzLite is dead-locked upstream for
  # JavaScript (config_utils.py rejects `none` while compile requires it), so the
  # weekly batch never goes green and only masks real failures. Manual runs via
  # workflow_dispatch remain; re-enable once the upstream contradiction is fixed.
  # schedule:
  #   - cron: '0 6 * * 0'

permissions: {}

jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Build Fuzzers
        id: build
        # Pinned to Maqbool61/clusterfuzzlite@fix/js-sanitizer-none (EGC#910):
        # patches config_utils.py inside the Docker image to allow SANITIZER=none
        # for JavaScript projects. Revert to google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1
        # once google/oss-fuzz#15907 is resolved upstream.
        uses: Maqbool61/clusterfuzzlite/actions/build_fuzzers@f3fd422fd0d55f2b4b2c3c1795ed4bcb7084ca41
        with:
          language: javascript
          sanitizer: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Fuzzers
        id: run
        uses: Maqbool61/clusterfuzzlite/actions/run_fuzzers@f3fd422fd0d55f2b4b2c3c1795ed4bcb7084ca41
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          language: javascript
          sanitizer: none
          output-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: cifuzz-sarif/results.sarif
