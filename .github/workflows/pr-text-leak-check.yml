name: PR Text Leak Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-text:
    name: Check PR title/body for internal-tool leaks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Fetch PR title, body, and every commit message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json title,body,commits --jq '
              .title + "\n" + .body + "\n"
              + ([.commits[] | .messageHeadline + "\n" + .messageBody] | join("\n"))
            ' > /tmp/pr-text.txt

      - name: Check for internal-tool leaks
        run: node scripts/check-internal-tool-leak.js --text "$(cat /tmp/pr-text.txt)"
